<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 采购管理平台</title>
    <link rel="stylesheet" href="../static/css.css">
</head>
<body>
<div class="main-container">
    <div class="top-nav">
        <div class="nav-inner">
            <div class="nav-left">
                <div class="nav-logo">采购管理平台</div>
                <div class="nav-links">
                    <a href="/">首页</a>
                    <a href="/notice">采购信息</a>
                    <a href="/announce">平台通知</a>
                    <a href="/policy">政策法规</a>
                    <a href="/guide">业务指南</a>
                </div>
            </div>
            <div class="nav-right">
                <span id="userWrap" style="display:none;position:relative;cursor:pointer;">
                    <span id="userShow"></span>
                    <div id="userMenu" style="display:none;position:absolute;right:0;top:100%;background:#fff;border:1px solid #ddd;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:999;min-width:150px;padding:6px 0;">
                        <div id="menuRole" style="padding:8px 14px;color:#555;font-size:13px;border-bottom:1px solid #f0f0f0;"></div>
                        <a href="/profile" id="menuProfile" style="display:none;padding:8px 14px;color:#1f4e99;text-decoration:none;white-space:nowrap;">个人中心</a>
                    </div>
                </span>
                <a id="loginBtn" href="/login">登录/注册</a>
                <button id="logoutBtn" onclick="logout()" style="display:none">退出登录</button>
            </div>
        </div>
    </div>
    <div class="wrap">
        <div class="block">
            <div class="block-title">用户登录</div>
            <div class="panel">
                <div class="msg error" id="loginErr">账号或密码错误</div>
                <div class="row">
                    <div class="col">
                        <label>账号</label>
                        <input type="text" id="username">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>密码</label>
                        <input type="password" id="password">
                    </div>
                </div>
                <div>
                    <button class="btn" id="submitLogin">登录</button>
                </div>
            </div>
        </div>
        <div class="block">
            <div class="block-title">新用户注册</div>
            <div class="panel">
                <div class="msg success" id="regSuccess">注册成功，请登录</div>
                <div class="msg error" id="regErr">注册失败</div>
                <div class="row">
                    <div class="col">
                        <label>账号</label>
                        <input type="text" id="regUsername">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>密码</label>
                        <input type="password" id="regPwd">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>确认密码</label>
                        <input type="password" id="regRepwd">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>公司名称</label>
                        <input type="text" id="regName">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>用户身份</label>
                        <select id="regRole">
                            <option value="supplier">供应方</option>
                            <option value="purchaser">采购方</option>
                            <option value="agent">代理机构</option>
                        </select>
                    </div>
                </div>
                <div>
                    <button class="btn" id="submitReg">提交注册</button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="footer">
    技术支持：KAI<br>
    Copyright© 采购管理平台 @KAI 版权所有
</div>
<script>
    function getAuthHeader(){
        const token = localStorage.getItem("token");
        if(token){
            return {"Authorization":"Bearer "+token}
        }
        return {};
    }
    function logout(){
        fetch("/logout", {
            method:"POST",
            credentials:"include",
            headers:{...getAuthHeader()}
        })
        .then(res=>{
            localStorage.removeItem("token");
            if(res.ok){
                location.href="/";
            }
        })
    }
    // 统一隐藏全部提示
    function hideAllMsg(){
        document.getElementById("loginErr").style.display = "none";
        document.getElementById("regSuccess").style.display = "none";
        document.getElementById("regErr").style.display = "none";
    }
    let loginLoading = false;
    // 登录逻辑
    async function doLogin(){
        if(loginLoading) return;
        loginLoading = true;
        hideAllMsg();
        const username = document.getElementById("username").value.trim();
        const pwd = document.getElementById("password").value.trim();
        const loginErr = document.getElementById("loginErr");
        if(!username || !pwd){
            loginErr.innerText="账号密码不能为空";
            loginErr.style.display="block";
            loginLoading = false;
            return;
        }
        try{
            const res = await fetch("/api/login",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    ...getAuthHeader()
                },
                body:JSON.stringify({username:username,password:pwd}),
                credentials:"include"
            })
            const ret = await res.json();
            if(ret.code === 200){
                localStorage.setItem("token", ret.token);
                location.href="/";
            }else{
                loginErr.innerText = ret.msg || "账号或密码错误";
                loginErr.style.display="block";
            }
        }catch(err){
            loginErr.innerText = "网络请求异常";
            loginErr.style.display="block";
        }finally{
            loginLoading = false;
        }
    }
    document.getElementById("submitLogin").addEventListener("click", doLogin);
    // 回车登录
    document.getElementById("password").addEventListener("keydown",e=>{
        if(e.key === "Enter") doLogin();
    })

    let regLoading = false;
    //注册逻辑
    async function doRegister(){
        if(regLoading) return;
        regLoading = true;
        hideAllMsg();
        const user = document.getElementById("regUsername").value.trim();
        const pwd = document.getElementById("regPwd").value.trim();
        const repwd = document.getElementById("regRepwd").value.trim();
        const name = document.getElementById("regName").value.trim();
        const role = document.getElementById("regRole").value;
        const regSuc = document.getElementById("regSuccess");
        const regErr = document.getElementById("regErr");
        if(!user || !pwd || !repwd || !name){
            regErr.innerText="所有输入框不能为空";
            regErr.style.display="block";
            regLoading = false;
            return;
        }
        if(pwd.length <6){
            regErr.innerText="密码长度不能少于6位";
            regErr.style.display="block";
            regLoading = false;
            return;
        }
        if(pwd !== repwd){
            regErr.innerText="两次密码不一致";
            regErr.style.display="block";
            regLoading = false;
            return;
        }
        try{
            const res = await fetch("/api/register",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    ...getAuthHeader()
                },
                body:JSON.stringify({username:user,password:pwd,name:name,role:role}),
                credentials:"include"
            })
            const ret = await res.json();
            if(ret.code === 200){
                regSuc.style.display="block";
            }else{
                regErr.innerText = ret.msg || "注册失败";
                regErr.style.display="block";
            }
        }catch(err){
            regErr.innerText = "网络请求异常";
            regErr.style.display="block";
        }finally{
            regLoading = false;
        }
    }
    document.getElementById("submitReg").addEventListener("click", doRegister);
    //注册确认密码框回车提交注册
    document.getElementById("regRepwd").addEventListener("keydown",e=>{
        if(e.key === "Enter") doRegister();
    })

    async function checkLoginStatus(){
        const res = await fetch("/api/user", {
            credentials:"include",
            headers:{...getAuthHeader()}
        });
        const user = await res.json();
        const userShow = document.getElementById("userShow");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        let roleText = "";
        if(user.role === "supplier") roleText = "供应方";
        if(user.role === "purchaser") roleText = "采购方";
        if(user.role === "agent") roleText = "代理机构";
        if(user.role === "super_admin") roleText = "超级管理员";
        if(user && user.username){
            userShow.innerText = `欢迎，${user.username}【${roleText}】`;
            userShow.style.fontWeight = "bold";
            userShow.style.color = "#1f4e99";
            const _roleMap = {"supplier":"供应方","purchaser":"采购方","agent":"代理机构","super_admin":"超级管理员"};
            document.getElementById("userWrap").style.display = "inline-block";
            document.getElementById("menuRole").innerText = `【${_roleMap[user.role] || user.role}】`;
            document.getElementById("menuProfile").style.display = ["supplier","purchaser","agent"].includes(user.role) ? "block" : "none";
            const _uw = document.getElementById("userWrap");
            const _um = document.getElementById("userMenu");
            _uw.onmouseenter = ()=>{ _um.style.display = "block"; };
            _uw.onmouseleave = ()=>{ _um.style.display = "none"; };
            loginBtn.style.display = "none";
            logoutBtn.style.display = "block";
        }else{
            userShow.innerText = "";
            loginBtn.style.display = "block";
            logoutBtn.style.display = "none";
        }
    }
    window.onload = function(){
        hideAllMsg();
        checkLoginStatus();
    }
</script>
</body>
</html>
