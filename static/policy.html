<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政策法规 - 采购管理平台</title>
    <link rel="stylesheet" href="../static/css.css">
</head>
<body>
<div class="main-container">
    <div class="top-nav">
        <div class="nav-inner">
            <div class="nav-left">
                <div class="nav-logo">采购管理平台</div>
                <div class="nav-links" id="navLinks">
                    <a href="/">首页</a>
                    <a href="/notice">采购信息</a>
                    <a href="/announce">平台通知</a>
                    <a href="/policy" class="active">政策法规</a>
                    <a href="/guide">业务指南</a>
                    <!-- 动态追加业务菜单 -->
                </div>
            </div>
            <div class="nav-right">
                <span id="userWrap" style="display:none;position:relative;cursor:pointer;">
                    <span id="userShow"></span>
                    <div id="userMenu" style="display:none;position:absolute;right:0;top:100%;background:#fff;border:1px solid #ddd;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:999;min-width:150px;padding:6px 0;">
                        <div id="menuRole" style="padding:8px 14px;color:#555;font-size:13px;border-bottom:1px solid #f0f0f0;"></div>
                        <a href="/profile" id="menuProfile" style="display:none;padding:8px 14px;color:#1f4e99;text-decoration:none;white-space:nowrap;">个人中心</a>
                    </div>
                </span>
                <a id="loginBtn" href="/login">登录/注册</a>
                <button id="logoutBtn" onclick="logout()" style="display:none">退出登录</button>
            </div>
        </div>
    </div>
    <div class="wrap">
        <div class="block">
            <div class="block-title">政策法规</div>
            <div class="panel" id="policyPanel">
                <div class="empty-tip">加载中...</div>
            </div>
        </div>
    </div>
</div>
<div class="footer">
    技术支持：KAI<br>
    Copyright© 采购管理平台 @KAI 版权所有
</div>
<script>
    function getAuthHeader(){
        const token = localStorage.getItem("token");
        if(token){
            return {"Authorization":"Bearer "+token}
        }
        return {};
    }
    function logout(){
        fetch("/logout", {
            method:"POST",
            credentials:"include",
            headers:{...getAuthHeader()}
        })
        .then(res=>{
            localStorage.removeItem("token");
            if(res.ok){
                location.href="/";
            }
        })
    }
    // 只展示政策法规（policy）
    async function loadPolicyList(){
        const dom = document.getElementById("policyPanel");
        try{
            const res = await fetch("/api/policy", {
                credentials:"include",
                headers:{...getAuthHeader()}
            });
            const ret = await res.json();
            const data = (ret && ret.data) || [];
            const list = data.filter(item => item.type === "policy");
            if(list.length === 0){
                dom.innerHTML = `<div class="empty-tip">暂无政策法规</div>`;
                return;
            }
            let html = "";
            list.forEach(item=>{
                html += `
                <div class="item">
                    <a href="/notice/${item.id}">${item.title}</a>
                    <span style="float:right;color:#888;font-size:13px;">${item.create_time || ""}</span>
                </div>`;
            })
            dom.innerHTML = html;
        }catch(e){
            dom.innerHTML = `<div class="empty-tip">数据加载失败</div>`;
        }
    }
    async function checkLoginStatus(){
        try{
            const res = await fetch("/api/user", {
                credentials:"include",
                headers:{...getAuthHeader()}
            });
            const user = await res.json();
            const userShow = document.getElementById("userShow");
            const loginBtn = document.getElementById("loginBtn");
            const logoutBtn = document.getElementById("logoutBtn");
            const navLinks = document.getElementById("navLinks");

            let roleText = "";
            if(user.role === "supplier") roleText = "供应方";
            if(user.role === "purchaser") roleText = "采购方";
            if(user.role === "agent") roleText = "代理机构";
            if(user.role === "super_admin") roleText = "超级管理员";

            navLinks.querySelectorAll(".dynamic-menu").forEach(el=>el.remove());

            if(user && user.username){
                userShow.innerText = `欢迎，${user.username}`;
                userShow.style.fontWeight = "bold";
                userShow.style.color = "#1f4e99";
                const _roleMap = {"supplier":"供应方","purchaser":"采购方","agent":"代理机构","super_admin":"超级管理员"};
                document.getElementById("userWrap").style.display = "inline-block";
                document.getElementById("menuRole").innerText = `【${_roleMap[user.role] || user.role}】`;
                document.getElementById("menuProfile").style.display = ["supplier","purchaser","agent"].includes(user.role) ? "block" : "none";
                const _uw = document.getElementById("userWrap");
                const _um = document.getElementById("userMenu");
                _uw.onmouseenter = ()=>{ _um.style.display = "block"; };
                _uw.onmouseleave = ()=>{ _um.style.display = "none"; };
                loginBtn.style.display = "none";
                logoutBtn.style.display = "block";
                // 供应方：开标室
                if(user.role === "supplier"){
                    navLinks.insertAdjacentHTML("beforeend",`<a href="/bid_room" class="dynamic-menu">开标室</a>`);
                }
                // 采购方/代理/超管：发布公告 + 开标室
                if(["purchaser","agent","super_admin"].includes(user.role)){
                    navLinks.insertAdjacentHTML("beforeend",`<a href="/publish" class="dynamic-menu">发布公告</a>`);
                    navLinks.insertAdjacentHTML("beforeend",`<a href="/bid_room" class="dynamic-menu">开标室</a>`);
                }
                if(user.role === "super_admin"){
                    navLinks.insertAdjacentHTML("beforeend",`<a href="/user_manage" class="dynamic-menu">账号管理</a>`);
                }
            }else{
                userShow.innerText = "";
                loginBtn.style.display = "block";
                logoutBtn.style.display = "none";
            }
        }catch(err){
            console.error("用户信息加载失败",err);
        }
    }
    window.onload = function(){
        loadPolicyList();
        checkLoginStatus();
    }
</script>
</body>
</html>
