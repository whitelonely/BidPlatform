<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号管理 - 采购管理平台</title>
    <link rel="stylesheet" href="../static/css.css">
</head>
<body>
<div class="main-container">
    <div class="top-nav">
        <div class="nav-inner">
            <div class="nav-left">
                <div class="nav-logo">采购管理平台</div>
                <div class="nav-links" id="navLinks">
                    <a href="/">首页</a>
                    <a href="/notice">采购信息</a>
                    <a href="/announce">平台通知</a>
                    <a href="/policy">政策法规</a>
                    <a href="/guide">业务指南</a>
                    <!-- 动态追加业务菜单 -->
                </div>
            </div>
            <div class="nav-right">
                <span id="userWrap" style="display:none;position:relative;cursor:pointer;">
                    <span id="userShow"></span>
                    <div id="userMenu" style="display:none;position:absolute;right:0;top:100%;background:#fff;border:1px solid #ddd;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:999;min-width:150px;padding:6px 0;">
                        <div id="menuRole" style="padding:8px 14px;color:#555;font-size:13px;border-bottom:1px solid #f0f0f0;"></div>
                        <a href="/profile" id="menuProfile" style="display:none;padding:8px 14px;color:#1f4e99;text-decoration:none;white-space:nowrap;">个人中心</a>
                    </div>
                </span>
                <a id="loginBtn" href="/login">登录/注册</a>
                <button id="logoutBtn" onclick="logout()" style="display:none">退出登录</button>
            </div>
        </div>
    </div>
    <div class="wrap">
        <div class="block">
            <div class="block-title">账号管理</div>
            <div class="panel">
                <div id="msgBox"></div>
                <div id="umNoPerm" style="color:red;display:none;">仅超级管理员可访问本页面</div>
                <div id="umContent">
                    <div style="margin-bottom:16px;">
                        <h4>新增账号</h4>
                        <div>
                            <label>用户名</label>
                            <input type="text" id="newUsername">
                        </div>
                        <div>
                            <label>密码</label>
                            <input type="password" id="newPwd">
                        </div>
                        <div>
                            <label>公司名称</label>
                            <input type="text" id="newName">
                        </div>
                        <div>
                            <label>角色</label>
                            <select id="newRole">
                                <option value="supplier">供应方</option>
                                <option value="purchaser">采购方</option>
                                <option value="agent">代理机构</option>
                                <option value="super_admin">超级管理员</option>
                            </select>
                        </div>
                        <button class="btn" id="addUserBtn">新增账号</button>
                    </div>
                    <hr>
                    <h4>账号列表</h4>
                    <table style="width:100%;border-collapse: collapse;margin:10px 0;">
                        <thead>
                            <tr style="background:#f5f5f5;">
                                <th style="border:1px solid #ddd;padding:8px;text-align:left;">用户名</th>
                                <th style="border:1px solid #ddd;padding:8px;text-align:left;">公司名称</th>
                                <th style="border:1px solid #ddd;padding:8px;text-align:left;">角色</th>
                                <th style="border:1px solid #ddd;padding:8px;text-align:left;">状态</th>
                                <th style="border:1px solid #ddd;padding:8px;text-align:left;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="userList">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="footer">
    技术支持：KAI<br>
    Copyright© 采购管理平台 @KAI 版权所有
</div>
<script>
    function getAuthHeader(){
        const token = localStorage.getItem("token");
        if(token){
            return {"Authorization":"Bearer "+token}
        }
        return {};
    }
    function logout(){
        fetch("/logout", {
            method:"POST",
            credentials:"include",
            headers:{...getAuthHeader()}
        }).then(res=>{
            localStorage.removeItem("token");
            if(res.ok){
                location.href="/";
            }
        })
    }
    function showMsg(text,tp="error"){
        document.getElementById("msgBox").innerHTML=`<div class="msg ${tp}">${text}</div>`
        setTimeout(()=>{document.getElementById("msgBox").innerHTML=""},3000)
    }
    let umLoading = false;
    let myUsername = "";
    let userRows = [];   // 缓存账号列表，供修改信息弹窗预填
    const roleMap = {
        "super_admin":"超级管理员",
        "agent":"代理机构",
        "purchaser":"采购方",
        "supplier":"供应方"
    };
    async function loadUserList(){
        const res = await fetch("/api/user_list",{
            credentials:"include",
            headers:{...getAuthHeader()}
        });
        const ret = await res.json();
        let html = "";
        userRows = ret.data;
        ret.data.forEach(u=>{
            const isMe = u.username === myUsername;
            // 启用/禁用按钮：传目标状态（当前状态取反）；自己不能操作
            const targetStatus = u.status === 1 ? 0 : 1;
            const btnLabel = u.status === 1 ? "禁用" : "启用";
            let opHtml = "";
            if(isMe){
                opHtml = `<span style="color:#999;">当前账号</span> <button class="btn" onclick="openInfoModal('${u.username}')">修改信息</button>`;
            }else{
                opHtml = `<button class="btn" onclick="openInfoModal('${u.username}')">修改信息</button> <button class="btn" onclick="toggleUserStatus('${u.username}',${targetStatus})">${btnLabel}</button>`;
            }
            html += `<tr>
                <td style="border:1px solid #ddd;padding:8px;">${u.username}</td>
                <td style="border:1px solid #ddd;padding:8px;">${u.name}</td>
                <td style="border:1px solid #ddd;padding:8px;">${roleMap[u.role] || u.role}</td>
                <td style="border:1px solid #ddd;padding:8px;">${u.status===1?"启用":"禁用"}</td>
                <td style="border:1px solid #ddd;padding:8px;">${opHtml}</td>
            </tr>`;
        })
        document.getElementById("userList").innerHTML = html;
    }
    // 超级管理员在账号管理里修改任意用户信息（悬浮窗口：用户名/公司名称/角色/密码）
    const DEFAULT_PWD = "123456";
    let editTarget = "";
    let editIsMe = false;
    window.openInfoModal = function(username){
        const u = userRows.find(x=>x.username===username);
        if(!u){ showMsg("未找到该账号"); return; }
        editTarget = username;
        editIsMe = (username === myUsername);
        document.getElementById("infoTitle").innerText = editIsMe ? "修改我的信息" : "修改信息";
        document.getElementById("infoUserLabel").innerText = "账号：" + username;
        document.getElementById("infoUsername").value = u.username;
        document.getElementById("infoName").value = u.name || "";
        const roleSel = document.getElementById("infoRole");
        roleSel.value = u.role;
        // 自己的角色不可修改（防止锁死管理员）
        roleSel.disabled = editIsMe;
        document.getElementById("infoRoleTip").style.display = editIsMe ? "block" : "none";
        document.getElementById("infoNewPwd").value = "";
        document.getElementById("infoModal").style.display = "flex";
    }
    window.closeInfoModal = function(){
        document.getElementById("infoModal").style.display = "none";
    }
    // 一键重置为默认密码
    window.infoResetDefault = async function(){
        if(!confirm("确定将「" + editTarget + "」的密码重置为默认密码 " + DEFAULT_PWD + " 吗？")) return;
        await doResetPwd(DEFAULT_PWD);
    }
    // 提交信息修改（用户名/公司名称/角色/密码）
    window.confirmInfoUpdate = async function(){
        const newUsername = document.getElementById("infoUsername").value.trim();
        const name = document.getElementById("infoName").value.trim();
        const role = document.getElementById("infoRole").value;
        const pwd = document.getElementById("infoNewPwd").value;
        if(!newUsername){
            showMsg("用户名不能为空");
            return;
        }
        if(role !== "super_admin" && !name){
            showMsg("公司名称不能为空");
            return;
        }
        try{
            const res = await fetch("/api/update_user",{
                method:"POST",
                credentials:"include",
                headers:{
                    "Content-Type":"application/json",
                    ...getAuthHeader()
                },
                body:JSON.stringify({username:editTarget,new_username:newUsername,name,role,new_password:pwd})
            })
            const ret = await res.json();
            if(ret.code===200){
                showMsg(ret.msg || "信息修改成功","success");
                closeInfoModal();
                loadUserList();
                // 修改的是自己（改名或改密）时，刷新页面让导航栏等信息同步
                if(editIsMe && (newUsername !== myUsername || pwd)){
                    setTimeout(()=>location.reload(), 600);
                }
            }else{
                showMsg(ret.msg || ret.detail || "操作失败");
            }
        }catch(err){
            showMsg("网络异常");
        }
    }
    // 仅重置密码（供"重置为默认密码"按钮调用）
    async function doResetPwd(newPassword){
        try{
            const res = await fetch("/api/admin_change_password",{
                method:"POST",
                credentials:"include",
                headers:{
                    "Content-Type":"application/json",
                    ...getAuthHeader()
                },
                body:JSON.stringify({username:editTarget,new_password:newPassword})
            })
            const ret = await res.json();
            if(ret.code===200){
                showMsg(ret.msg || "密码修改成功","success");
                closeInfoModal();
            }else{
                showMsg(ret.msg || ret.detail || "操作失败");
            }
        }catch(err){
            showMsg("网络异常");
        }
    }
    window.toggleUserStatus = async function(username,targetStatus){
        if(!confirm(`确定将账号「${username}」${targetStatus === 1 ? "启用" : "禁用"}吗？`)) return;
        try{
            const res = await fetch("/api/toggle_user_status",{
                method:"POST",
                credentials:"include",
                headers:{
                    "Content-Type":"application/json",
                    ...getAuthHeader()
                },
                body:JSON.stringify({username,status:targetStatus})
            })
            const ret = await res.json();
            if(ret.code===200){
                showMsg("账号状态修改成功","success");
                loadUserList();
            }else{
                showMsg(ret.msg || ret.detail || "操作失败");
            }
        }catch(err){
            showMsg("网络异常");
        }
    }
    document.getElementById("addUserBtn").addEventListener("click",async ()=>{
        if(umLoading) return;
        umLoading=true;
        const username = document.getElementById("newUsername").value.trim();
        const pwd = document.getElementById("newPwd").value.trim();
        const name = document.getElementById("newName").value.trim();
        const role = document.getElementById("newRole").value;
        if(role!=="super_admin" && !name){
            showMsg("公司名称不能为空");
            umLoading=false;
            return;
        }
        if(!username||!pwd){
            showMsg("用户名、密码不能为空");
            umLoading=false;
            return;
        }
        try{
            const res = await fetch("/api/add_user",{
                method:"POST",
                credentials:"include",
                headers:{
                    "Content-Type":"application/json",
                    ...getAuthHeader()
                },
                body:JSON.stringify({username,password:pwd,name:(role==="super_admin"?"超级管理员":name),role})
            })
            const ret = await res.json();
            if(ret.code===200){
                showMsg("账号新增成功","success");
                loadUserList();
                document.getElementById("newUsername").value="";
                document.getElementById("newPwd").value="";
                document.getElementById("newName").value="";
            }else{
                showMsg(ret.msg || "新增失败");
            }
        }catch(err){
            showMsg("网络异常");
        }finally{
            umLoading=false;
        }
    })
    async function checkAuth(){
        const res = await fetch("/api/user", {
            credentials:"include",
            headers:{...getAuthHeader()}
        });
        const user = await res.json();
        const userShow = document.getElementById("userShow");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const navLinks = document.getElementById("navLinks");
        const umNoPerm = document.getElementById("umNoPerm");
        const umContent = document.getElementById("umContent");
        navLinks.querySelectorAll(".dynamic-menu").forEach(el=>el.remove());

        if(user && user.username){
            myUsername = user.username;
            userShow.innerText = `欢迎，${user.role === "super_admin" ? user.username : (user.name || user.username)}`;
            userShow.style.fontWeight = "bold";
            userShow.style.color = "#1f4e99";
            const _roleMap = {"supplier":"供应方","purchaser":"采购方","agent":"代理机构","super_admin":"超级管理员"};
            document.getElementById("userWrap").style.display = "inline-block";
            document.getElementById("menuRole").innerText = `【${_roleMap[user.role] || user.role}】`;
            document.getElementById("menuProfile").style.display = ["supplier","purchaser","agent"].includes(user.role) ? "block" : "none";
            const _uw = document.getElementById("userWrap");
            const _um = document.getElementById("userMenu");
            _uw.onmouseenter = ()=>{ _um.style.display = "block"; };
            _uw.onmouseleave = ()=>{ _um.style.display = "none"; };
            loginBtn.style.display = "none";
            logoutBtn.style.display = "block";
            // 动态导航：发布公告 + 开标室 + 账号管理(当前页)
            navLinks.insertAdjacentHTML("beforeend",`<a href="/bid_room" class="dynamic-menu">开标室</a>`);
            navLinks.insertAdjacentHTML("beforeend",`<a href="/publish" class="dynamic-menu">发布公告</a>`);
            navLinks.insertAdjacentHTML("beforeend",`<a href="/user_manage" class="dynamic-menu active">账号管理</a>`);
            if(user.role !== "super_admin"){
                umNoPerm.style.display="block";
                umContent.style.display="none";
            }else{
                umNoPerm.style.display="none";
                umContent.style.display="block";
                loadUserList();
            }
        }else{
            userShow.innerText = "";
            loginBtn.style.display = "block";
            logoutBtn.style.display = "none";
            umNoPerm.style.display="block";
            umContent.style.display="none";
        }
    }
    window.onload = function(){
        checkAuth();
        // 选择"超级管理员"角色时隐藏公司名称输入（管理员只填用户名和密码）
        const _roleSel = document.getElementById("newRole");
        const _nameRow = document.getElementById("newName").parentElement;
        _roleSel.addEventListener("change", function(){
            _nameRow.style.display = this.value === "super_admin" ? "none" : "block";
        });
    }
</script>
<!-- 修改信息悬浮窗口 -->
<div id="infoModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:8px;padding:24px;width:400px;box-shadow:0 4px 20px rgba(0,0,0,.2);">
        <h3 style="margin:0 0 8px;" id="infoTitle">修改信息</h3>
        <div id="infoUserLabel" style="color:#888;font-size:13px;margin-bottom:16px;"></div>
        <div style="margin-bottom:10px;">
            <label style="display:block;margin-bottom:4px;">用户名</label>
            <input type="text" id="infoUsername" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;">
        </div>
        <div style="margin-bottom:10px;">
            <label style="display:block;margin-bottom:4px;">公司名称</label>
            <input type="text" id="infoName" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;">
        </div>
        <div style="margin-bottom:10px;">
            <label style="display:block;margin-bottom:4px;">角色</label>
            <select id="infoRole" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;">
                <option value="supplier">供应方</option>
                <option value="purchaser">采购方</option>
                <option value="agent">代理机构</option>
                <option value="super_admin">超级管理员</option>
            </select>
            <div id="infoRoleTip" style="color:#b71c1c;font-size:12px;margin-top:4px;display:none;">当前账号角色不可修改</div>
        </div>
        <div style="border-top:1px dashed #ddd;margin:14px 0 10px;padding-top:10px;">
            <button class="btn" onclick="infoResetDefault()" style="width:100%;">重置为默认密码 123456</button>
        </div>
        <div style="margin-bottom:6px;color:#666;font-size:13px;">新密码（留空表示不修改密码）</div>
        <input type="password" id="infoNewPwd" placeholder="留空则不修改密码" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;">
        <div style="margin-top:18px;text-align:right;">
            <button class="btn btn-gray" onclick="closeInfoModal()">取消</button>
            <button class="btn" id="infoSubmitBtn" onclick="confirmInfoUpdate()" style="margin-left:8px;">确认修改</button>
        </div>
    </div>
</div>
<script>
</script>
</body>
</html>
